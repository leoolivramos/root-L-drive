name: CI — Lint, Typecheck & Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Lint com Ruff
  # -----------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff lint
        run: ruff check app/ --output-format=github

      - name: Run Ruff format check
        run: ruff format --check app/

  # -----------------------------------------------------------------------
  # Job 2: Type-check com Mypy
  # -----------------------------------------------------------------------
  typecheck:
    name: Typecheck (Mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (sem torch para acelerar CI)
        run: |
          pip install \
            fastapi==0.116.1 \
            pydantic==2.11.7 \
            pydantic-settings==2.10.1 \
            motor==3.7.1 \
            python-jose[cryptography]==3.5.0 \
            passlib[bcrypt]==1.7.4 \
            minio==7.2.18 \
            celery==5.4.0 \
            redis==5.2.1 \
            mypy==1.11.2 \
            types-passlib \
            types-redis

      - name: Run Mypy
        run: mypy app --ignore-missing-imports --no-error-summary

  # -----------------------------------------------------------------------
  # Job 3: Testes unitários com pytest
  # -----------------------------------------------------------------------
  test-unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU-only, sem GPU)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            fastapi==0.116.1 \
            uvicorn[standard]==0.35.0 \
            motor==3.7.1 \
            pydantic==2.11.7 \
            pydantic-settings==2.10.1 \
            python-jose[cryptography]==3.5.0 \
            passlib[bcrypt]==1.7.4 \
            bcrypt==4.3.0 \
            minio==7.2.18 \
            python-multipart==0.0.20 \
            email-validator==2.2.0 \
            celery==5.4.0 \
            redis==5.2.1 \
            PyPDF2==3.0.1 \
            python-docx==1.0.1 \
            cryptography \
            pytest==8.3.3 \
            pytest-asyncio==0.24.0 \
            httpx==0.27.2 \
            mongomock-motor==0.0.30

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        env:
          FILE_ENCRYPTION_KEY_BASE64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
          MONGODB_HOST: "localhost"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"

  # -----------------------------------------------------------------------
  # Job 4: Testes de integração
  # -----------------------------------------------------------------------
  test-integration:
    name: Integration Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            fastapi==0.116.1 \
            uvicorn[standard]==0.35.0 \
            motor==3.7.1 \
            pydantic==2.11.7 \
            pydantic-settings==2.10.1 \
            python-jose[cryptography]==3.5.0 \
            passlib[bcrypt]==1.7.4 \
            bcrypt==4.3.0 \
            minio==7.2.18 \
            python-multipart==0.0.20 \
            email-validator==2.2.0 \
            celery==5.4.0 \
            redis==5.2.1 \
            PyPDF2==3.0.1 \
            python-docx==1.0.1 \
            cryptography \
            pytest==8.3.3 \
            pytest-asyncio==0.24.0 \
            httpx==0.27.2 \
            mongomock-motor==0.0.30

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          FILE_ENCRYPTION_KEY_BASE64: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
          MONGODB_HOST: "localhost"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"
          MINIO_ENDPOINT: "localhost:9000"
