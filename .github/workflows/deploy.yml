name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: ${{ secrets.DOCKER_REGISTRY_USER }}/private-driver-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_REGISTRY_USER }}/private-driver-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_FRONTEND }}:buildcache,mode=max

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      REGISTRY: docker.io
      DOCKER_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
      IMAGE_BACKEND: ${{ secrets.DOCKER_REGISTRY_USER }}/private-driver-backend
      IMAGE_FRONTEND: ${{ secrets.DOCKER_REGISTRY_USER }}/private-driver-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload docker-compose to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/tmp"

      - name: Deploy via SSH (with Rollback)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            trap 'handle_error' ERR

            handle_error() {
              echo ""
              echo "ERRO NO DEPLOY - INICIANDO ROLLBACK"

              if [ -f ${{ secrets.DEPLOY_DIRECTORY }}/docker-compose.prod.yml.backup ]; then
                echo "[ROLLBACK] Restaurando docker-compose anterior..."
                cp ${{ secrets.DEPLOY_DIRECTORY }}/docker-compose.prod.yml.backup ${{ secrets.DEPLOY_DIRECTORY }}/docker-compose.prod.yml

                echo "[ROLLBACK] Parando containers..."
                docker compose -f ${{ secrets.DEPLOY_DIRECTORY }}/docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

                echo "[ROLLBACK] Iniciando containers com versão anterior..."
                docker compose -f ${{ secrets.DEPLOY_DIRECTORY }}/docker-compose.prod.yml up -d

                sleep 5
                echo "[ROLLBACK] Status dos containers após rollback:"
                docker ps --filter "name=private-drive"
              fi

              exit 1
            }

            echo "Private Driver - Production Deployment"
            echo ""

            DEPLOY_DIR="${{ secrets.DEPLOY_DIRECTORY }}"
            cd "$DEPLOY_DIR"

            export DOCKER_USER="${{ secrets.DOCKER_REGISTRY_USER }}"

            echo "[0] Validando arquivo .env do servidor..."
            if [ ! -f .env ]; then
              echo "ERRO: .env não encontrado no servidor"
              exit 1
            fi
            echo "✓ .env encontrado"

            echo "[1] Validando docker-compose.prod.yml enviado..."
            if ! COMPOSE_CONFIG_OUTPUT=$(docker compose -f /tmp/docker-compose.prod.yml --env-file .env config 2>&1); then
              echo "⚠️  Aviso: a validação antecipada do docker-compose.prod.yml falhou."
              echo "$COMPOSE_CONFIG_OUTPUT"
            else
              echo "✓ docker-compose.prod.yml válido"
            fi

            echo ""
            echo "[2] Criando backup do docker-compose anterior..."
            if [ -f docker-compose.prod.yml ]; then
              cp docker-compose.prod.yml docker-compose.prod.yml.backup
              echo "✓ Backup criado: docker-compose.prod.yml.backup"
            fi

            echo ""
            echo "[3] Atualizando docker-compose.prod.yml..."
            mv /tmp/docker-compose.prod.yml docker-compose.prod.yml
            echo "✓ docker-compose.prod.yml atualizado com sucesso"

            echo ""
            echo "[4] Puxando imagens Docker do Hub..."
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest
            echo "✓ Imagens puxadas com sucesso"

            echo ""
            echo "[5] Parando containers antigos..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            echo "✓ Containers parados"

            echo ""
            echo "[6] Iniciando novos containers..."
            docker compose -f docker-compose.prod.yml up -d
            echo "✓ Containers iniciados"

            echo ""
            echo "[7] Aguardando a API ficar pronta (120s)..."
            WAIT_COUNT=0
            MAX_WAIT=120
            while [ $WAIT_COUNT -lt $MAX_WAIT ]; do
              if curl -sf http://localhost:8000/health >/dev/null; then
                echo "✓ API respondeu com sucesso"
                break
              fi
              WAIT_COUNT=$((WAIT_COUNT + 5))
              sleep 5
              echo "  Aguardando... ($WAIT_COUNT/$MAX_WAIT segundos)"
            done

            echo ""
            echo "[8] Verificando status dos containers..."
            docker ps --filter "name=private-drive"

            echo ""
            echo "[9] Verificando conectividade da API..."
            API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$API_HEALTH" = "200" ]; then
              echo "✓ API respondendo normalmente (HTTP 200)"
            else
              echo "API respondeu com HTTP $API_HEALTH"
            fi

            echo ""
            echo "Deploy concluído com sucesso!"
            echo ""
            echo "Últimos logs:"
            docker compose -f docker-compose.prod.yml logs --tail=15

      - name: Deployment Status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'production-deploy',
              description: `Deploy bem-sucedido (${context.ref.split('/').pop()})`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Deployment Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'production-deploy',
              description: 'Deploy falhou e o rollback foi acionado',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
